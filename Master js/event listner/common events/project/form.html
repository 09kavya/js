<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Now Display";
        }
        html,body{
            width: 100%;
            height: 100%;
         
        }
        .main{
            padding: 50px;
            
            width: 100%;
            height: 100%;
            background-color: #222;
            color: white;
            /* background-color: blue; */
            
        }
       
        input{
           height: 25px;
           background-color: #ffffff; 
           color: rgb(0, 0, 0);
           border: solid rgb(75, 73, 73); 
           display: flex;
           
        }
        .card{
            max-width: 300px;
            color: white;
            margin-top:40px ;
            border-radius: 10px ;
            display: inline-block;
            padding: 20px;
            border: 2px solid #e3e3e3;
        }
        .profile{
           width: 50px;
           height: 50px;
           /* background-color: red; */
           border-radius: 50%;
           margin-bottom: 7px;
           overflow: hidden;
          
        }
        .profile img{
            height: 50px;
           width: 50px;
           
        }
        .card h5{
            margin-top: 3px;

        }
        .card p{
            font-size: 12px;
            margin-top: 30px;
            /* text-transform: 20px; */
        }
    </style>
</head>
<body>
    <div class="main">
        <form action="" >
            <input
                type="text"
                
                placeholder="profile pic"
                
            />
            <input
                type="text"
                
                placeholder="name"
                
            />

            <input
                type="text"
                
                placeholder="occupation"
                
            />

            

            
            <input
                type="text"
                
                placeholder="info"
                
            />

            <input type="submit" />
        </form>
       
    <script src="form.js"></script>
</body>
</html>
