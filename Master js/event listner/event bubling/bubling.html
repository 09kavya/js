<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Now Display";
            background-color: black;
        }
        html,body{
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
         
        }
        .main{
            height: 100%;
            width: 100%;
        }
        .nav{
            padding: 30px;
            
            font-size: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #333;
            
        }
        a{
            background-color: #333;
            color: aliceblue;
            text-decoration: none;
        }
        button{
            color: aliceblue;
            border: none;
            background-color: rgb(95, 42, 42);
            height: 40px;
            width: 120px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="nav">
            <a href="">homs</a>
            <a href="">about</a>
            <button>Click me!!</button>
        </div>
     </div>  
    <script src="bubling.js"></script>
</body>
</html>
